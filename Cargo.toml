[package]
name = "snake"
version = "0.1.0"
authors = [ "Markus Silván <msilvan@iki.fi>" ]
readme = "README.md"
edition = "2021"
license = "MIT"

[dependencies]
bevy = "0.17"
rand = "0.8.5"
wasm-bindgen = "0.2"

# rand 0.8 uses getrandom 0.2, which needs the "js" feature on the web
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.17", features = ["dynamic_linking"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
strip = "debuginfo"
