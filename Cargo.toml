[package]
name = "snake"
version = "0.1.0"
authors = [ "Markus Silván <msilvan@iki.fi>" ]
readme = "README.md"
edition = "2021"
license = "MIT"

[dependencies]
bevy = "0.20"
rand = "0.10"
wasm-bindgen = "0.2"

# rand uses getrandom, which needs the "wasm_js" feature on the web
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", features = ["dynamic_linking"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
strip = "debuginfo"
